name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # Before an hour of wheel builds: the tag and the version CMake writes have to
  # be the same number.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag and project(EinsteinSummation VERSION ...) must agree
        run: |
          written=$(sed -n 's/^project(EinsteinSummation VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          tagged="${GITHUB_REF_NAME#v}"
          test "$written" = "$tagged" || {
            echo "CMakeLists.txt says $written, the tag says $tagged"; exit 1; }

  # Shared with Trial release, so what a tag builds is what a dry run built.
  wheels:
    needs: version
    uses: ./.github/workflows/wheels.yml

  release:
    needs: wheels
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/*.whl
