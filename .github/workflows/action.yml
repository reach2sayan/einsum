name: CMake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cxx: [ g++-14, clang++-20 ]

    steps:
      - uses: actions/checkout@v4

      # No libboost-dev: Boost, Eigen and mdspan are fetched against a pin, and
      # a distribution's idea of Boost is older than Boost.Parser anyway.
      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache
          if [[ "${{ matrix.cxx }}" == g++-* ]]; then
            sudo apt-get install -y "${{ matrix.cxx }}"
          else
            wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
            sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main"
            sudo apt-get update
            sudo apt-get install -y clang-20
          fi

      # Keyed on the file that names the pins, so a version bump misses the
      # cache and nothing else does.
      - name: Cache the pinned dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.deps
          key: ${{ runner.os }}-deps-${{ hashFiles('cmake/EinsumDependencies.cmake') }}
          restore-keys: ${{ runner.os }}-deps-

      # One preset, two compilers: CXX is what picks, and the toolchain probe in
      # cmake/ refuses anything below GCC 14 / Clang 20 whichever it is.
      - name: Configure
        env:
          CXX: ${{ matrix.cxx }}
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release

  single-header:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-14

      - name: Cache the pinned dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.deps
          key: ${{ runner.os }}-deps-${{ hashFiles('cmake/EinsumDependencies.cmake') }}
          restore-keys: ${{ runner.os }}-deps-

      # Configure only, to unpack the pinned sources the smoke test needs on its
      # include path.
      - name: Fetch the dependencies
        env:
          CXX: g++-14
        run: cmake --preset release -DEINSUM_BUILD_TESTS=OFF -DEINSUM_BUILD_BENCHMARKS=OFF

      - name: Regenerate the single header
        run: python3 scripts/amalgamate.py

      # It has to be self-contained, which is the only thing about it that can
      # rot: no include path into include/, nothing from src/.
      - name: Compile against the single header alone
        run: |
          BOOST=$(ls -d .deps/boost-*/ | head -1)
          EIGEN=$(ls -d .deps/eigen-*/ | head -1)
          MDSPAN=$(ls -d .deps/mdspan-*/ | grep -v subbuild | head -1)
          g++-14 -std=c++23 -fsyntax-only -Isingle_include \
            -isystem "$BOOST" -isystem "$EIGEN" -isystem "${MDSPAN}include" \
            tests/single_header_smoke.cpp

      - name: Fail if the committed single header is stale
        run: git diff --exit-code single_include/einsum.hpp
