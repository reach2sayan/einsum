# The wheel matrix, called and never triggered.  Release runs it for a tag and
# publishes what comes out; Trial release runs the same thing on demand and
# publishes nothing.  One copy, because a trial that built wheels a different
# way would not be a trial of anything.
name: Wheels

on:
  workflow_call:

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # cibuildwheel reads [tool.cibuildwheel] in pyproject.toml: the
      # interpreters, the manylinux image and its gcc-toolset-15, and the
      # per-wheel `pytest {package}/python/tests` that has to pass before a
      # wheel is kept.  Nothing about the build lives here.
      #
      # The version is not a formality.  Each release pins the manylinux image
      # it runs in, and the one v3.1.1 pins (2025.07.23-1) carries patchelf
      # 0.17.2, which lays out a rewritten ELF wrong: `.dynstr` ends up outside
      # any LOAD segment and .init/.plt are moved into a segment appended after
      # it.  auditwheel reaches for patchelf whenever it grafts a library, so
      # the Linux wheel started segfaulting inside dlopen -- before a line of
      # Python ran -- the moment EINSUM_OPENMP=ON gave it a libgomp to carry.
      # v4.2.1's image has patchelf 0.19.1, where the same repair is sound.
      # Read a bump as a floor and not a preference.
      - uses: pypa/cibuildwheel@v4.2.1

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
