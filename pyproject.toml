# The Python bindings.  `pip install .` configures this repository's own
# CMakeLists with the extension turned on, so one command builds libeinsum_rt
# and the module that links it.  A release builds that wheel per platform under
# [tool.cibuildwheel] below.
[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
# The import package is `einsum`; the distribution is not, because the name is
# taken on PyPI and a wheel nobody can install by its own name is worse than a
# longer one.
name = "einsum-cpp"
dynamic = ["version"]
description = "Einstein summation over NumPy arrays, from a C++23 einsum"
readme = "README.md"
license = { file = "LICENSE.txt" }
authors = [{ name = "Sayan", email = "reach2sayan@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.23"]

[dependency-groups]
# pybind11 is a build dependency above, where the wheel build gets it in an
# isolated environment.  It is here as well because the `python` CMake preset
# builds in-tree against this virtualenv and asks the interpreter for it.
dev = ["pybind11>=3.0", "pytest>=8", "pybind11-stubgen>=2.5", "numpy>=1.23",
       "mypy>=1.11"]

# One version, CMake's: `project(einsum VERSION ...)` is where the
# number is written, and test_package.py checks the module against the same line.
[[tool.dynamic-metadata]]
field = "version"
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(einsum VERSION (?P<value>[0-9]+\.[0-9]+\.[0-9]+)'

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.26"
cmake.build-type = "Release"
wheel.packages = ["python/einsum"]
# Kept between builds, so an edit to the binding recompiles one file rather than
# re-unpacking Boost.
build-dir = "build/wheel/{wheel_tag}"
sdist.exclude = ["cmake-build-*", ".deps", ".venv", "build"]

[tool.scikit-build.cmake.define]
EINSUM_BUILD_PYTHON = "ON"
EINSUM_BUILD_TESTS = "OFF"
EINSUM_BUILD_BENCHMARKS = "OFF"
# python/CMakeLists.txt installs the two shared objects into the package itself;
# the headers and the CMake package are not a wheel's business.
EINSUM_INSTALL = "OFF"
# A wheel runs on machines other than the one that built it, so the x86 baseline
# (x86-64-v3) rather than the runner's CPU.  Without this the default is
# -march=native and the wheel is unloadable anywhere else.
EINSUM_NATIVE_ARCH = "OFF"
# The check asks a compiler for the include closure with `-M`, which is a
# GCC/Clang spelling -- so it cannot run in the MSVC wheel build at all.  It has
# nothing to say about a wheel on any platform either: EINSUM_INSTALL is OFF
# above, so no header is installed for the list to be stale against.
EINSUM_CHECK_VENDORED_HEADERS = "OFF"

# --- release wheels -----------------------------------------------------------
# One wheel per CPython: pybind11 has no stable-ABI mode, and native_enum and
# array_t are outside the limited API in any case.
[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux* *-win32 *_i686 cp3??t-*"
build-frontend = "build[uv]"
build-verbosity = 1
test-requires = "pytest"
# The import is its own step, before pytest, because a wheel that cannot be
# loaded fails in a way pytest cannot report: the extension is imported during
# collection, so the process dies before pytest has written a line, and even the
# faulthandler traceback pytest installs by default never reaches the log.  What
# is left is `Segmentation fault` from the shell and nothing naming a cause.
# Importing first separates "the wheel does not load here" from "a test fails",
# and prints what the loader actually resolved when it is the former.
test-command = "python -c \"import faulthandler, sys; faulthandler.enable(); import einsum; print('import ok:', einsum.__file__, 'on', sys.version)\" && pytest -q {package}/python/tests"

# manylinux_2_28 ships GCC 12, below this project's GCC 14 floor -- the
# toolchain probe stops the configure with a message saying so -- and
# gcc-toolset-15 is how that image offers a newer one.  EINSUM_DEPS_DIR points
# outside the copied checkout, so Boost is unpacked once for all four
# interpreters rather than four times.
#
# EINSUM_OPENMP here and not in the [cmake.define] table above: auditwheel
# carries libgomp into the Linux wheel, and nothing carries vcomp140.dll into
# the Windows one, so the Windows wheel runs its products on one thread.
[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
before-all = [
    "dnf -y --setopt=retries=5 install gcc-toolset-15-gcc gcc-toolset-15-gcc-c++ gcc-toolset-15-binutils ccache",
    "/opt/rh/gcc-toolset-15/root/usr/bin/g++ --version",
    "mkdir -p /project/.deps",
]
environment = { CC = "/opt/rh/gcc-toolset-15/root/usr/bin/gcc", CXX = "/opt/rh/gcc-toolset-15/root/usr/bin/g++", PATH = "/opt/rh/gcc-toolset-15/root/usr/bin:$PATH", CMAKE_ARGS = "-DEINSUM_DEPS_DIR=/project/.deps -DEINSUM_OPENMP=ON", CCACHE_DIR = "/project/.deps/ccache", CCACHE_MAXSIZE = "2G" }

# No macOS wheel: the tree needs libstdc++'s C++23 <expected> and
# std::views::enumerate, and Apple Clang has neither.

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
target-version = "py311"
src = ["python"]
# Generated by pybind11-stubgen from the built module; regenerate it with the
# einsum_python_stubs target rather than editing it to please a linter.
extend-exclude = ["python/einsum/_einsum.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "A", "B", "SIM", "NPY", "RUF", "ANN", "D"]
# D401 wants every docstring to open in the imperative.  This tree names what a
# thing *is* rather than ordering the reader about, in the C++ comments and here.
ignore = ["D203", "D213", "D401"]

[tool.ruff.lint.per-file-ignores]
"python/tests/*" = ["D100", "D103", "ANN001", "ANN201"]
"scripts/*" = ["ANN"]

[tool.mypy]
files = ["python/einsum", "python/tests"]
strict = true
# So `python/einsum` resolves as the package `einsum` rather than by path.
mypy_path = ["python"]
# python/tests carries no __init__.py, and without these its files are modules
# named by basename alone -- `test_parity`, `conftest` -- which no override
# pattern can address as a group, because a mypy pattern takes `*` only as a
# whole component.  With them the same files are `tests.*`, which the override
# below names once and a new test file joins by existing.
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
# The suites are checked, but not made to annotate themselves.  A test function
# is called by pytest and by nothing else: its signature is fixtures in and
# None out, so a return type restates what the name already says, and ruff is
# told the same thing three lines up (ANN001 and ANN201 under
# per-file-ignores).  Strict everywhere here would have meant 37 `-> None` and
# no reader better off.
#
# Only the annotation rules are lifted.  What a test *does* is still checked
# against the package's own types, which is the part worth having: two calls
# below carry a narrow `type: ignore` precisely because mypy was right about
# them, and switching this to ignore_errors would have thrown that away.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
# Generated by pybind11-stubgen and used for its types, not audited for style.
# Regenerate with the einsum_python_stubs target.
module = ["einsum._einsum"]
ignore_errors = true

[tool.uv]
# `uv sync` provisions the dev tools; it does not install this project.
# scikit-build-core's editable install works through a meta-path finder, which
# beats every sys.path entry -- so an editable install silently shadows the
# build tree that ctest compiles and points at.  `cmake --build` is the
# edit-rebuild loop here.
package = false
